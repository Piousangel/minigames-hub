# 아침 회의(06:00 클라우드 루틴) 자료. 파일 이름 = 이 지표를 쓸 회의 날짜(KST 06시 기준) → docs/daily/metrics/<날짜>.md
# 필요 시크릿: CLOUDFLARE_API_TOKEN(D1 Edit(쿼리 API가 Edit 요구) · Account Analytics Read · Zone Read · Zone Analytics Read 포함), CLOUDFLARE_ACCOUNT_ID
name: metrics
on:
  # GitHub 예약 실행은 3~5시간씩 늦는다(11-14·15 실측: 04:07 예약이 07:57·09:19에 실행). 전날 밤부터
  # 세 번 걸어, 하나만 제때 돌아도 회의 전에 파일이 있게 한다. 늦게 돈 실행은 다음 회의용 파일이 된다.
  schedule:
    - cron: '17 12 * * *'  # 21:17 KST
    - cron: '17 16 * * *'  # 01:17 KST
    - cron: '7 19 * * *'   # 04:07 KST
  workflow_dispatch:
permissions:
  contents: write
  issues: write # Threads 토큰 알림 이슈 생성
concurrency:
  group: metrics
jobs:
  metrics:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: 지표 수집
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # 회의 날짜 = (KST 현재 + 18시간)의 날짜. 06:00 KST 이전 실행은 오늘 회의용, 이후는 내일 회의용.
          d=$(TZ=Asia/Seoul date -d '+18 hours' +%F)
          echo "MEETING_DATE=$d" >> "$GITHUB_ENV"
          mkdir -p docs/daily/metrics
          {
            echo "_수집: $(TZ=Asia/Seoul date '+%F %H:%M') KST_"
            node scripts/daily-metrics.mjs
          } > "docs/daily/metrics/$d.md"
      - name: 마케팅 게시 성과
        continue-on-error: true
        env:
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
        run: |
          node scripts/marketing-stats.mjs >> "docs/daily/metrics/$MEETING_DATE.md"
          cat "docs/daily/metrics/$MEETING_DATE.md"
      - name: Threads 토큰 알림(이슈 생성 → 오너 메일)
        # 갱신 실패·새 토큰 발급·남은 기간 14일 이하이면 이슈를 만든다(GitHub이 오너에게 메일로 알린다). 이미 열린 같은 제목 이슈가 있으면 만들지 않는다.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          f="docs/daily/metrics/$MEETING_DATE.md"
          msg=$(grep -E "⚠️ Threads 토큰|Threads 토큰: .*새 토큰이 발급됨|Threads 토큰: .*남은 기간 약 ([0-9]|1[0-3])일" "$f" | head -1 || true)
          [ -z "$msg" ] && exit 0
          title="Threads 토큰 확인 필요"
          if gh issue list --state open --search "$title in:title" --json number -q '.[0].number' | grep -q .; then exit 0; fi
          gh issue create --title "$title" --body "$(printf '%s\n\n%s\n' "지표 수집이 Threads 토큰 상태 이상을 감지했다: $msg" '조치: Claude Code 세션에서 "Threads 토큰 갱신해줘"라고 하면 메모리(threads-posting-setup)의 절차대로 새 토큰을 받아 등록한다(Meta 앱 → 토큰 생성기 → 시크릿 THREADS_ACCESS_TOKEN, 공백 제거). 토큰은 60일 장기 토큰이며, 갱신은 매일 자동 시도되지만 새 토큰 문자열이 발급되면 시크릿 교체가 필요하다. 이 이슈는 처리 후 닫으면 된다.')"
      - name: 커밋
        run: |
          git config user.name "minigames-metrics[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/daily/metrics
          git diff --cached --quiet || git commit -m "chore(metrics): $MEETING_DATE 회의용 지표"
          git pull --rebase -q && git push
