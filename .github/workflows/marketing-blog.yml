# 주간 블로그: 마케터가 PR로 넣은 docs/marketing/blog/<날짜>-<slug>/ 를 main 머지 후 처리한다.
# 실사이트 화면 캡처(Playwright) → 이미지 커밋 → velog.ready.md 생성(사람이 붙여넣기) → dev.to 자동 게시.
# 시크릿: DEVTO_API_KEY (없으면 dev.to는 skipped, 캡처와 velog 원고는 그대로 진행)
name: marketing-blog
on:
  push:
    branches: [main]
    paths: ['docs/marketing/blog/**', '!docs/marketing/blog/posted.json']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: marketing-blog
jobs:
  blog:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Playwright 준비(저장소 의존성과 분리)
        run: |
          mkdir -p /tmp/pw && cd /tmp/pw && npm init -y >/dev/null && npm i --silent playwright@1.49.1
          npx --prefix /tmp/pw playwright install --with-deps chromium
      - name: 화면 캡처
        env:
          PW_DIR: /tmp/pw
        run: node scripts/blog-publish.mjs shots
      - name: 이미지 커밋(공개 URL이 먼저 살아 있어야 dev.to 이미지가 뜬다)
        run: |
          git config user.name "marketing-bot[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/marketing/blog
          git diff --cached --quiet || (git commit -m "chore(blog): 화면 캡처 $(TZ=Asia/Seoul date +%F)" && git pull --rebase -q && git push)
      - name: velog 최종본 + dev.to 게시
        env:
          DEVTO_API_KEY: ${{ secrets.DEVTO_API_KEY }}
        run: node scripts/blog-publish.mjs publish
      - name: 기록 커밋
        run: |
          git add docs/marketing/blog
          git diff --cached --quiet || (git commit -m "chore(blog): 발행 기록 $(TZ=Asia/Seoul date +%F)" && git pull --rebase -q && git push)
