# main에 머지되면 검사 후 Cloudflare Workers로 배포한다.
# 아침 클라우드 팀 루틴은 로컬 wrangler 로그인이 없으므로 배포는 여기서 한다.
# 필요한 저장소 시크릿: CLOUDFLARE_API_TOKEN (Workers Scripts:Edit, D1:Edit, Zone Workers Routes:Edit 권한), CLOUDFLARE_ACCOUNT_ID
name: deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: deploy
  cancel-in-progress: false
jobs:
  deploy:
    # 수동 실행(workflow_dispatch)도 main에서만 — 리뷰 안 된 브랜치가 프로덕션에 가지 않게(저장소 안전 설정 E, 11-20).
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      # 전체 vitest(11-20 만성 실패 0). PR 단계 CI(ci.yml)와 겹치지만, 브랜치 보호로 CI가 필수가 되기 전까지 빨간 PR이 머지돼도 여기서 막는 안전망.
      - run: pnpm test
      # 추가 전용·멱등 D1 마이그레이션(CREATE TABLE IF NOT EXISTS만). 기존 표·행은 건드리지 않는다.
      # 실패해도 배포는 진행한다 — 워커가 slime_daily 없이도 동작(검증된 점수를 scores에 추가하는 폴백),
      # visit_days·visit_seen 없이도 동작(방문자를 세지 않고 홈 줄을 숨김).
      - name: D1 additive migrations
        continue-on-error: true
        run: pnpm exec wrangler d1 execute minigames-leaderboard --remote --file db/migrations/0001_slime_daily.sql
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # 오늘 방문자 표(0002). 앞 단계와 따로 실패하게 별도 스텝. --file(가져오기 경로) 대신 --command(일반 쿼리)로 보낸다.
      - name: D1 additive migration 0002 (visitors)
        continue-on-error: true
        run: pnpm exec wrangler d1 execute minigames-leaderboard --remote --command "$(sed 's/--.*$//' db/migrations/0002_visitors.sql | tr '\n' ' ')"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # deploy = next build → check-routes → wrangler deploy
      - run: pnpm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
