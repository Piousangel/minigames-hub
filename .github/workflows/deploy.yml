# main에 머지되면 검사 후 Cloudflare Workers로 배포한다.
# 아침 클라우드 팀 루틴은 로컬 wrangler 로그인이 없으므로 배포는 여기서 한다.
# 필요한 저장소 시크릿: CLOUDFLARE_API_TOKEN (Workers Scripts:Edit, D1:Edit, Zone Workers Routes:Edit 권한), CLOUDFLARE_ACCOUNT_ID
name: deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: deploy
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      # 전체 vitest·e2e 스모크는 PR 단계 CI(ci.yml)가 머지 전에 돈다(11-20, 만성 실패 0). 배포에서는 다시 돌리지 않는다.
      # 추가 전용·멱등 D1 마이그레이션(CREATE TABLE IF NOT EXISTS만). 기존 표·행은 건드리지 않는다.
      # 실패해도 배포는 진행한다 — 워커가 slime_daily 없이도 동작(검증된 점수를 scores에 추가하는 폴백).
      - name: D1 additive migrations
        continue-on-error: true
        run: pnpm exec wrangler d1 execute minigames-leaderboard --remote --file db/migrations/0001_slime_daily.sql
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # deploy = next build → check-routes → wrangler deploy
      - run: pnpm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
